<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="940" viewBox="0 0 1560 940" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="940" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">spec-decode - speculative decoding, provably exact</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">A cheap draft proposes k tokens; the target verifies them in one pass; the output is distributed exactly as the target's.</text><rect x="50" y="172" width="250" height="326" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="163" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">THE MODEL ORACLE</text><rect x="70" y="206" width="210" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,221) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text x="116" y="237" font-size="16.5" font-weight="700" fill="#17509f">Target model</text><text x="87" y="259.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">next_dist(prefix) -&gt; p</text><text x="87" y="276.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">expensive, high quality</text><rect x="70" y="305" width="210" height="87" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,320) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4z"/></g><text x="116" y="336" font-size="16.5" font-weight="700" fill="#552fae">Draft model</text><text x="87" y="358.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">next_dist(prefix) -&gt; q</text><text x="87" y="375.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">cheap approximation</text><rect x="70" y="404" width="210" height="87" rx="14" fill="#eef1f6" stroke="#8494ab" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,419) scale(0.8750)" fill="none" stroke="#8494ab" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 0 1 6-6h8"/><path d="M15 1l3 3-3 3"/><path d="M20 14a6 6 0 0 1-6 6H6"/><path d="M9 23l-3-3 3-3"/></g><text x="116" y="435" font-size="16.5" font-weight="700" fill="#3d4a63">Uniform RNG</text><text x="87" y="457.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">injected [0,1) source</text><text x="87" y="474.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">one uniform per draw</text><rect x="360" y="235" width="257" height="150" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(476.5,249) scale(1.0000)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="9" r="2.5"/><path d="M6 7.5v9"/><path d="M18 11.5c0 4-4 3.5-12 3.5"/></g><text x="488.5" y="293" text-anchor="middle" font-size="16.5" font-weight="700" fill="#552fae">Draft proposes k</text><text x="488.5" y="314.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">autoregressive, cheap</text><text x="488.5" y="331.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">sample(q, rng) per token</text><text x="488.5" y="349.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">remembers each q</text><rect x="657" y="235" width="257" height="150" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(773.5,249) scale(1.0000)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="785.5" y="293" text-anchor="middle" font-size="16.5" font-weight="700" fill="#17509f">Target verifies</text><text x="785.5" y="314.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">scores k+1 positions</text><text x="785.5" y="331.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">ONE forward pass</text><text x="785.5" y="349.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">counts as 1 target pass</text><rect x="954" y="235" width="257" height="150" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1070.5,249) scale(1.0000)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v4a4 4 0 0 0 4 4h8"/><path d="M6 21v-4a4 4 0 0 1 4-4h8"/><path d="M15 8l3 3-3 3"/><path d="M15 14l3 3-3 3"/></g><text x="1082.5" y="293" text-anchor="middle" font-size="16.5" font-weight="700" fill="#9e2b36">Accept / reject</text><text x="1082.5" y="314.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">min(1, p/q), in order</text><text x="1082.5" y="331.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">reject -&gt; residual, stop</text><text x="1082.5" y="349.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">all pass -&gt; bonus token</text><rect x="1251" y="235" width="257" height="150" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1367.5,249) scale(1.0000)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M5 15h14M10 3L8 21M17 3l-2 18"/></g><text x="1379.5" y="293" text-anchor="middle" font-size="16.5" font-weight="700" fill="#186547">Emit tokens</text><text x="1379.5" y="314.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">1 to k+1 per step</text><text x="1379.5" y="331.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">exactly target's dist</text><text x="1379.5" y="349.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">loop until n_tokens</text><circle cx="488" cy="219" r="13" fill="#ffffff" stroke="#8494ab" stroke-width="1.8"/><text x="488" y="223.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8494ab">1</text><circle cx="785" cy="219" r="13" fill="#ffffff" stroke="#8494ab" stroke-width="1.8"/><text x="785" y="223.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8494ab">2</text><circle cx="1082" cy="219" r="13" fill="#ffffff" stroke="#8494ab" stroke-width="1.8"/><text x="1082" y="223.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8494ab">3</text><circle cx="1379" cy="219" r="13" fill="#ffffff" stroke="#8494ab" stroke-width="1.8"/><text x="1379" y="223.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8494ab">4</text><path d="M300,310.0 L358,310.0" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><path d="M617,310.0 L655,310.0" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><path d="M914,310.0 L952,310.0" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><path d="M1211,310.0 L1249,310.0" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="50" y="560" width="1460" height="200" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="551" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">THE TWO CLAIMS, CHECKED - NOT ASSERTED</text><rect x="74" y="594" width="320" height="140" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(90,609) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.4 8.2-8 9-4.6-.8-8-4-8-9V6z"/></g><text x="120" y="625" font-size="16.5" font-weight="700" fill="#186547">Exact - closed form</text><text x="91" y="647.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">induced_from_dists(p, q)</text><text x="91" y="664.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">q*accept + reject*residual</text><text x="91" y="682.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">equals target p, provably</text><rect x="434" y="594" width="320" height="140" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(450,609) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></g><text x="480" y="625" font-size="16.5" font-weight="700" fill="#136b74">Certified numerically</text><text x="451" y="647.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">max_total_variation</text><text x="451" y="664.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">~1e-16 over 1000s of (p,q)</text><text x="451" y="682.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the one exactness number</text><rect x="794" y="594" width="320" height="140" rx="14" fill="#eef1f6" stroke="#8494ab" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(810,609) scale(0.8750)" fill="none" stroke="#8494ab" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/></g><text x="840" y="625" font-size="16.5" font-weight="700" fill="#3d4a63">Trace accounting</text><text x="811" y="647.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">target_passes vs tokens</text><text x="811" y="664.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">acceptance_rate</text><text x="811" y="682.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">tokens_per_step</text><rect x="1154" y="594" width="336" height="140" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1170,609) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g><text x="1200" y="625" font-size="16.5" font-weight="700" fill="#8c5a0d">Speedup, honestly</text><text x="1171" y="647.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">tokens_per_step /</text><text x="1171" y="664.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">(1 + k * draft_cost_ratio)</text><text x="1171" y="682.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">no unmeasured GPU number</text><path d="M1379,385 L1379.0,459.0 Q1379,474 1364.0,474.0 L795.0,474.0 Q780,474 780.0,489.0 L780,558" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="946.408" y="462.0" width="187.184" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="1040" y="478.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">exact + fast - both checked</text><rect x="50" y="790" width="720" height="76.8" rx="11" fill="#fde5e7" stroke="#e05561" stroke-width="1.4" stroke-opacity="0.8"/><text x="66" y="814" font-size="13.2" font-weight="700" fill="#9e2b36">The residual is the whole trick</text><text x="66" y="836" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">On a rejection, sample normalize(relu(p - q)) - exactly the mass the</text><text x="66" y="854.4" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">target wanted that the draft under-supplied. accepted + residual == p.</text><rect x="790" y="790" width="720" height="95.19999999999999" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="806" y="814" font-size="13.2" font-weight="700" fill="#186547">One core, six languages</text><text x="806" y="836" font-size="12.4" fill="#186547" fill-opacity="0.92">An injected uniform [0,1) source makes the accept/reject state machine</text><text x="806" y="854.4" font-size="12.4" fill="#186547" fill-opacity="0.92">identical across Python, Go, Rust, C#, Java, and TypeScript.</text><text x="806" y="872.8" font-size="12.4" fill="#186547" fill-opacity="0.92">numpy PCG64, Dirichlet helpers, the CLI and matplotlib stay Python-only.</text><text x="780.0" y="922" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/spec-decode</text></svg>